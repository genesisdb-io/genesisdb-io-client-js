name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing:
        description: Publish the version currently in package.json without bumping it
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'skip-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - run: npm test

      - name: Bump version
        if: github.event_name == 'push' || inputs.publish_existing == false
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          npm version patch -m "v%s [skip-ci]"

      - name: Push tag
        if: github.event_name == 'push' || inputs.publish_existing == false
        run: git push --follow-tags

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_SECRET }}
